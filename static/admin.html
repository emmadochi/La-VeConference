<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La-Vie Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body {
            background-color: #0d1117 !important;
            color: #c9d1d9 !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Inter', sans-serif !important;
            display: flex !important;
            flex-direction: row !important;
            height: 100vh !important;
            overflow: hidden !important;
        }
        
        .admin-sidebar {
            flex: 0 0 250px;
            background: rgba(22, 27, 34, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
        }
        
        .admin-sidebar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
        }
        
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            color: #8b949e;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 8px;
            cursor: pointer;
        }
        
        .admin-nav-item:hover, .admin-nav-item.active {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
        }
        
        .admin-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        .stat-card .title {
            color: #8b949e;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-card .value {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .stat-card .icon {
            color: #00e5ff;
            font-size: 2rem;
            align-self: flex-end;
            margin-top: -40px;
        }
        
        .charts-container {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .data-tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .data-tables-container {
                grid-template-columns: 1fr;
            }
        }

        .data-table-card {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
        }

        .data-table-card h3 {
            margin-top: 0;
            color: white;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: #8b949e;
            font-weight: 500;
            font-size: 0.9rem;
        }

        td {
            color: #c9d1d9;
            font-size: 0.95rem;
        }

        .badge-active {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .badge-inactive {
            background: rgba(139, 148, 158, 0.1);
            color: #8b949e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        #errorBanner {
            background: rgba(255, 85, 85, 0.1);
            border: 1px solid #ff5555;
            color: #ff5555;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* Loading overlay */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 229, 255, 0.1);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Verifying Admin Access...</p>
    </div>

    <aside class="admin-sidebar">
        <div class="logo">
            <img src="/static/logoI.png" alt="Logo" style="height: 24px; border-radius: 4px;">
            <span>Admin</span>
        </div>
        
        <a class="admin-nav-item active">
            <span class="material-symbols-outlined">dashboard</span>
            Overview
        </a>
        <a class="admin-nav-item" href="/">
            <span class="material-symbols-outlined">home</span>
            Back to App
        </a>
        <div style="flex: 1;"></div>
        <a class="admin-nav-item" id="logoutBtn" style="color: #ff5555;">
            <span class="material-symbols-outlined">logout</span>
            Exit Admin
        </a>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h2>Dashboard Overview</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="adminEmail" style="color: #00e5ff;"></span>
            </div>
        </div>
        
        <div id="errorBanner"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="title">Total Users</div>
                <div class="value" id="statUsers">-</div>
                <span class="material-symbols-outlined icon">group</span>
            </div>
            
            <div class="stat-card">
                <div class="title">Active Rooms</div>
                <div class="value" id="statRooms">-</div>
                <span class="material-symbols-outlined icon">podcasts</span>
            </div>
            
            <div class="stat-card">
                <div class="title">Total Scheduled Meetings</div>
                <div class="value" id="statMeetings">-</div>
                <span class="material-symbols-outlined icon">event_available</span>
            </div>
        </div>

        <div class="charts-container">
            <h3 style="margin-top: 0; color: white; font-size: 1.1rem; margin-bottom: 20px;">Platform Growth Overview</h3>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="overviewChart"></canvas>
            </div>
        </div>

        <div class="data-tables-container">
            <div class="data-table-card">
                <h3>Recent Users</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Name / Email</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentUsersTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="data-table-card">
                <h3>Upcoming Meetings</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Date/Time</th>
                            </tr>
                        </thead>
                        <tbody id="upcomingMeetingsTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Config and Auth Logic -->
    <script type="module" src="/static/firebase-config.js"></script>
    <script type="module" src="/static/admin.js"></script>
</body>
</html>
