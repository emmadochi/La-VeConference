workflows:
  la-vie-conference-ios:
    name: La-Vie Conference iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: la_vie_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6837527943
        BUNDLE_ID: "org.lifechangerstouch.lavie"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install && cd ..
      - name: Flutter build ipa
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - info@lifechangerstouch.org
        notify:
          success: true
          failure: true

  lichat-messenger-ios:
